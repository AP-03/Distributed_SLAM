# Multi-robot marker-cluster ground truth.
#
# Safe pilot mode:
#   Leave marker_positions empty and bootstrap_from_first_frame true. The node
#   publishes a temporary pose whose origin is each robot's LED centroid.
#
# Publication mode:
#   Measure every LED center in the robot base_link frame, fill marker_positions
#   for each robot, and set bootstrap_from_first_frame false. Then the published
#   /gt/<robot_id>/pose is the measured base_link pose in mocap_world.
#
# Current measured marker geometry:
#   marker_positions below come from PhaseSpace rigid-body JSON exports:
#     robot_01 -> r1 (4).json
#     robot_02 -> r2 (4).json
#     robot_03 -> r3 (3).json
#     robot_04 -> r4 (8).json
#     robot_05 -> r5 (3).json
#     robot_06 -> r6 (1).json
#   The exported `pos=` values are millimetres in the PhaseSpace rigid-local
#   frame, converted here to metres.

world_frame: mocap_world
input_topic: /phasespace/stamped/markers
subscriber_queue_size: 1

defaults:
  bootstrap_from_first_frame: false
  bootstrap_min_markers: 8
  min_visible_markers: 4
  min_condition: 0.0
  reject_zero_positions: true
  reject_outliers: true
  max_marker_error: 0.15
  publish_rate: 120.0
  publish_tf: true
  publish_path: true
  path_downsample: 20
  max_path_length: 20000
  position_covariance: 0.01
  orientation_covariance: 0.05

robots:
  - robot_id: robot_01
    child_frame: robot_01/mocap_rigid
    marker_ids: [0, 1, 2, 3, 5, 6]
    marker_positions:
